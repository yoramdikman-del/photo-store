<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../album.css">
<style>
@font-face{font-family:'Amatic SC';font-weight:700;src:url(../../fonts/amatic-sc-hebrew-700-normal.woff2)}
@font-face{font-family:'Assistant';font-weight:800;src:url(../../fonts/assistant-hebrew-800-normal.woff2)}
@font-face{font-family:'Assistant';font-weight:600;src:url(../../fonts/assistant-hebrew-600-normal.woff2)}
html,body{margin:0;background:#fff}
#s{width:1080px;height:1350px;background:#f6f3ee;position:relative;overflow:hidden;font-family:'Assistant',sans-serif;color:#1e2a44;box-sizing:border-box;padding:60px 64px}
.kick{display:inline-block;background:#f39c3c;color:#1e2a44;font-weight:800;font-size:30px;border-radius:999px;padding:8px 26px}
h1{font-family:'Amatic SC';font-size:132px;line-height:.95;margin:22px 0 10px}
.sub{font-size:36px;font-weight:600;color:#56627c;margin:0 0 34px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.t{background:#fff;border-radius:18px;box-shadow:0 10px 26px rgba(34,48,77,.13);overflow:hidden;position:relative}
.t img{width:100%;height:330px;object-fit:cover;display:block;background:#fff}
.t b{position:absolute;bottom:14px;right:14px;background:#1e2a44;color:#fff;font-size:30px;font-weight:800;border-radius:12px;padding:6px 18px}
.foot{position:absolute;left:64px;right:64px;bottom:52px;display:flex;align-items:center;gap:22px}
.foot img{width:96px;height:96px;border-radius:50%}
.foot .cta{flex:1;background:#1e2a44;color:#fff;border-radius:20px;padding:20px 28px;font-size:36px;font-weight:800}
.foot .cta small{display:block;font-size:26px;font-weight:600;color:#f5c27a}
</style></head><body>
<div id="s">
  <span class="kick">📖 מדריך חדש באתר</span>
  <h1>איך בוחרים חצובה<br>לטיולים ולשטח</h1>
  <p class="sub">6 דברים לבדוק לפני שקונים · קרבון או אלומיניום?</p>
  <div class="grid">
    <div class="t"><img src="../../media/1005010157874815/img_03.jpg"><b>לטלפון</b></div>
    <div class="t"><img src="../../media/1005004626847608/img_02.jpg"><b>אלומיניום</b></div>
    <div class="t"><img src="../../media/1005008255738991/img_01.jpg"><b>קרבון לטיולים</b></div>
    <div class="t"><img src="../../media/1005008015218973/img_01.jpg"><b>ראש וידאו</b></div>
  </div>
  <div class="foot"><div class="cta">המדריך המלא ב-myripo.com<small>צילום מאהבה ❤️</small></div><img src="../../logo.png"></div>
</div></body></html>
