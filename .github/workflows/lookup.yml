name: בדיקת מוצרים לפי מספר

on:
  push:
    paths: ['search/lookup.txt']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lookup
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: חיפוש באלי אקספרס
        env:
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
        run: python scripts/lookup.py
      - name: שמירת התוצאות
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add search/lookup.json
          git commit -m "תוצאות בדיקת מוצרים" || exit 0
          git pull --rebase
          git push
