name: הורדת תמונות מוצרים

on:
  push:
    branches: [main]
    paths: ['media/requests.txt']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: הורדת תמונות
        env:
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
        run: python scripts/fetch_media.py
      - name: שמירה במאגר
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/
          git diff --cached --quiet || (git commit -m "תמונות מוצרים חדשות" && git push)
