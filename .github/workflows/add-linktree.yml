name: הוספת מוצרים מהלינקטרי – סבב 1

on:
  push:
    paths: ['scripts/add_linktree.py']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: add-linktree
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: הוספת מוצרים
        env:
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
        run: python scripts/add_linktree.py
      - name: שמירת התוצאות 
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "הוספת מוצרים מהלינקטרי – סבב 1" || exit 0
          git pull --rebase
          git push
