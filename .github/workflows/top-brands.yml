name: מוצרים מובילים לפי מותג

on:
  push:
    paths: ['search/top_brands.txt', 'scripts/top_brands.py']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: top-brands
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: שליפת מוצרים מובילים
        env:
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
        run: python scripts/top_brands.py
      - name: שמירת התוצאות (לא מוצגות באתר)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add search/top_brands.json search/top_brands.csv
          git commit -m "מוצרים מובילים לפי מותג" || exit 0
          git pull --rebase
          git push
